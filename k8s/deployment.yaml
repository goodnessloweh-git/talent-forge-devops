apiVersion: apps/v1
kind: Deployment
metadata:
  name: talent-forge
  labels:
    app: talent-forge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: talent-forge
  template:
    metadata:
      labels:
        app: talent-forge
    spec:
      containers:
        - name: talent-forge
          image: talent-forge:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: talent-forge-config
            - secretRef:
                name: talent-forge-secret
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
